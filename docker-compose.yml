services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    command: pnpm run db:push
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      INGESTION_TOKEN: "generate-a-secure-random-token-for-production"
      INGEST_WEBHOOK_SECRET_GITHUB: "your-github-webhook-secret-here"
      INGEST_WEBHOOK_SECRET_STRIPE: "your-stripe-webhook-secret-here"
    ports:
      - "3000:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
